name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      # Catches a dashboard that no longer compiles
      - run: npm run build

  # PRs: only the scanner/utils lines this PR changed are mutated (fast). At least 80% of
  # planted bugs must be caught. A PR also can't lower the ratchet (thresholds.break).
  # See docs/ENGINEERING_PROCESS.md.
  mutation-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ratchet can only go up
        run: |
          base=$(git show origin/${{ github.base_ref }}:stryker.config.json 2>/dev/null | node -pe 'try { JSON.parse(require("fs").readFileSync(0)).thresholds.break ?? 0 } catch { 0 }')
          head=$(node -pe 'require("./stryker.config.json").thresholds.break')
          echo "break: base $base, this PR $head"
          node -e "process.exit(Number($head) >= Number($base) ? 0 : 1)" || { echo "::error::thresholds.break was lowered ($base -> $head)"; exit 1; }
      - run: npm run mutate:changed -- origin/${{ github.base_ref }} --concurrency 4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-changed-report
          path: |
            out/mutation-changed.html
            out/mutation-changed.json

  # After merge: the whole-project score (slow). Turns main red if it fell below the ratchet.
  mutation-full:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx stryker run --concurrency 4
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            out/mutation.html
            out/mutation.json

  # Answer keys against the live targets at their pinned commits (docs/design-notes/answer-key-test.md).
  # Fetched from upstream (user decision): a deleted pinned commit fails its fetch step, and the fix then is a fork.
  # Always runs (no paths filter, nothing skipped), so it can become a required check. The refs must equal each key's
  # `commit`: the script fails as infrastructure (exit 2) if a checkout isn't that commit, untouched.
  answer-keys:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    # Reads untrusted upstream code (scanned as text, never run): the token only needs to read this repo
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm ci: the pattern scanners use Node built-ins only (a new dependency would fail the import, not pass)
      - name: Fetch Juice Shop at the key's commit
        uses: actions/checkout@v4
        with:
          repository: juice-shop/juice-shop
          ref: 1618a611b173b4bf114028e6e02549950606e29d
          path: targets/juice-shop
          persist-credentials: false
      - name: Fetch DVNA at the key's commit
        uses: actions/checkout@v4
        with:
          repository: appsecco/dvna
          ref: 9ba473add536f66ac9007966acb2a775dd31277a
          path: targets/dvna
          persist-credentials: false
      - name: Fetch Express at the key's commit
        uses: actions/checkout@v4
        with:
          repository: expressjs/express
          ref: 7ef98448f8b38099ab1ded55e458538ad47a51e7
          path: targets/express
          persist-credentials: false
      - name: Compare with the answer keys
        run: npm run answer-keys:ci -- targets
